<style>
:root{
  --bg:#000; --bg2:#0b0b0b; --card:#121212; --card2:#171717; --line:#222; --line2:#2e2e2e;
  --txt:#fff; --mut:#a3a3a3; --mut2:#8a8a8a; --acc:#ffffff; --edit:#4da3ff; --danger:#ff5a5a;
  --r:16px; --wrap:1160px;
  --fh:'Archivo',system-ui,sans-serif; --fb:'Poppins',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--txt);font-family:var(--fb);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 32px;position:relative}
.frame{position:relative}
.frame::before,.frame::after{content:"";position:fixed;top:0;bottom:0;width:1px;background:#141414;pointer-events:none;z-index:0}
.frame::before{left:max(16px,calc(50% - var(--wrap)/2))}
.frame::after{right:max(16px,calc(50% - var(--wrap)/2))}

/* a11y & navigation upgrades */
:focus-visible{outline:2px solid #4da3ff;outline-offset:3px;border-radius:6px}
.skip{position:fixed;left:16px;top:-60px;z-index:400;background:#fff;color:#000;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;transition:top .2s}
.skip:focus{top:12px}
.menu a{position:relative;padding:6px 0}
.menu a.on{color:#fff}
.menu a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:var(--acc)}
.totop{position:fixed;right:20px;bottom:20px;z-index:60;width:46px;height:46px;border-radius:50%;background:rgba(18,18,18,.9);border:1px solid #2c2c2c;color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transform:translateY(12px);pointer-events:none;transition:opacity .3s,transform .3s,background .2s;backdrop-filter:blur(10px)}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop:hover{background:#fff;color:#000}
.totop svg{width:18px;height:18px}
.nav.scrolled{background:rgba(0,0,0,.88);box-shadow:0 8px 30px rgba(0,0,0,.45)}
.btn,.mini,.gbtn,.like{min-height:40px}
.mini{padding:9px 14px}
.dl{width:42px;height:42px}
.pcard:focus-visible{outline-offset:4px}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} .rv{opacity:1;transform:none;transition:none} *{animation-duration:.01ms!important} }

/* type */
.h{font-family:var(--fh);font-variation-settings:"wdth" 108;font-weight:800;text-transform:uppercase;letter-spacing:-.005em;line-height:1.08}
h2.h{font-size:clamp(28px,3.6vw,44px)}
h3.h{font-size:17px;letter-spacing:.01em}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.eyebrow svg{width:14px;height:14px;color:var(--acc)}
.bar{width:64px;height:2px;background:#3a3a3a;margin:22px 0}
.center .bar{margin:22px auto}
.lead{color:var(--mut);font-size:14px;max-width:520px}
.center{text-align:center}.center .lead{margin:0 auto}
.ml{white-space:pre-line}
section{position:relative;z-index:1;padding:110px 0}
.alt{background:var(--bg2);border-top:1px solid #151515;border-bottom:1px solid #151515}

/* nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid #161616}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;gap:20px}
.brand{font-family:var(--fh);font-weight:900;font-variation-settings:"wdth" 115;font-size:20px;letter-spacing:.02em;text-transform:uppercase}
.menu{display:flex;gap:28px;font-size:13px;color:var(--mut)}
.menu a{transition:color .2s}.menu a:hover{color:#fff}
.nav-cta{font-size:13px;font-weight:500;padding:10px 18px;border-radius:999px;background:var(--acc);color:#000}
.burger{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);align-items:center;justify-content:center}
.burger svg{width:18px}

/* hero */
.hero{padding:70px 0 0}
.hero-card{position:relative;border:1px solid #1c1c1c;border-radius:28px;background:radial-gradient(120% 90% at 75% 20%,#161616 0%,#050505 55%,#000 100%);overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;min-height:560px}
.hero-txt{padding:72px 0 64px 64px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
.greet{font-size:17px;margin-bottom:6px}
.name{font-family:var(--fh);font-weight:900;font-variation-settings:"wdth" 100;text-transform:uppercase;font-size:clamp(52px,7.4vw,104px);line-height:.95;letter-spacing:-.02em;word-break:break-word}
.role{margin-top:14px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);opacity:.9}
.intro{margin-top:18px;color:var(--mut);font-size:14px;max-width:430px}
.sig{font-family:'Mrs Saint Delafield',cursive;font-size:54px;line-height:1.1;margin-top:18px;color:#e9e9e9;min-height:40px}
.cta{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;font-size:13px;font-weight:500;transition:transform .2s,opacity .2s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--acc);color:#000}
.btn.ghost{border:1px solid var(--line2)}
.btn svg{width:15px;height:15px}
.hero-photo{position:relative;display:flex;align-items:flex-end;justify-content:center;padding:40px 70px 0 0}
.hero-photo .ph,.hero-photo img{width:100%;max-width:420px;aspect-ratio:4/5;object-fit:cover;border-radius:22px 22px 0 0;-webkit-mask-image:linear-gradient(#000 68%,transparent 100%);mask-image:linear-gradient(#000 68%,transparent 100%)}
.social{position:absolute;right:26px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px;z-index:3}
.social a{width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.social a:hover{transform:scale(1.1)}
.social svg{width:15px;height:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid #1c1c1c;border-top:0;border-radius:0 0 28px 28px;margin-top:-1px}
.stat{padding:26px 28px;border-right:1px solid #1c1c1c;position:relative}
.stat:last-child{border-right:0}
.stat .n{font-family:var(--fh);font-weight:800;font-size:34px;line-height:1}
.stat .l{font-size:12px;color:var(--mut);margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
.hero-card.has-stats{border-radius:28px 28px 0 0}

/* placeholder image */
.ph{background:linear-gradient(160deg,#1d1d1d,#0b0b0b);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#4a4a4a;font-size:12px;text-align:center}
.ph svg{width:46px;height:46px}

/* branding */
.zig{display:grid;gap:34px;margin-top:64px}
.zrow{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;position:relative}
.zrow:nth-child(even) .ztxt{order:2}
.ztxt h3{font-size:28px}
.ztxt p{color:var(--mut);font-size:14px;margin-top:14px;max-width:440px}
.zimg{border-radius:var(--r);overflow:hidden;aspect-ratio:16/10;position:relative}
.zimg img,.zimg .ph{width:100%;height:100%;object-fit:cover}

/* experience */
.exp-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:60px;align-items:start}
.sticky{position:sticky;top:110px}
.exp-list{display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid #1b1b1b;border-radius:var(--r);position:relative;transition:border-color .25s}
.card:hover{border-color:#2c2c2c}
.xcard{display:grid;grid-template-columns:auto 1fr;gap:20px;padding:26px 28px}
.num{width:44px;height:44px;border-radius:50%;border:1px solid #333;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;color:#ddd}
.xcard .comp{font-size:14px;color:#d9d9d9;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:4px}
.chip svg{width:13px;height:13px}
.xcard .desc{color:var(--mut);font-size:13.5px;margin-top:12px}

/* education */
.edu-panel{display:grid;grid-template-columns:.9fr 1.1fr;gap:64px;align-items:center}
.edu-photo{border-radius:22px;overflow:hidden;aspect-ratio:4/5;position:relative;max-width:440px}
.edu-photo img,.edu-photo .ph{width:100%;height:100%;object-fit:cover}
.elist{display:flex;flex-direction:column;gap:22px;margin-top:30px}
.eitem{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;position:relative;padding:4px 0}
.icirc{width:50px;height:50px;border-radius:50%;border:1px solid #333;display:flex;align-items:center;justify-content:center;color:#e6e6e6}
.icirc svg{width:20px;height:20px}
.eitem .sub{font-size:13px;color:#cfcfcf}
.eitem .yr{font-size:12px;color:var(--mut2)}

/* skills */
.sk-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:60px;align-items:start}
.sk-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.scard{padding:22px;display:flex;flex-direction:column;gap:10px}
.scard .top{display:flex;align-items:center;gap:14px}
.scard .icirc{width:42px;height:42px}
.scard .icirc svg{width:17px;height:17px}
.scard p{font-size:13px;color:var(--mut)}
.meter{height:4px;background:#232323;border-radius:4px;overflow:hidden;margin-top:auto}
.meter i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .4s}
.pct{font-size:11px;color:var(--mut2);display:flex;justify-content:space-between;align-items:center;gap:10px}
.pct input[type=range]{flex:1;accent-color:var(--edit)}

/* projects */
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:56px}
.pcard{border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid #1b1b1b;cursor:pointer;display:flex;flex-direction:column;transition:transform .25s,border-color .25s;text-align:left}
.pcard:hover{transform:translateY(-3px);border-color:#333}
.pcard.big{grid-column:span 2;grid-row:span 2}
.pcover{aspect-ratio:16/10;position:relative;overflow:hidden;background:#111}
.pcard.big .pcover{aspect-ratio:auto;flex:1;min-height:320px}
.pcover img,.pcover .ph{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pcover .cat{position:absolute;left:14px;top:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);padding:5px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12)}
.pbody{padding:18px 20px 20px}
.pbody .date{font-size:12px;color:var(--mut2)}
.pbody h3{margin-top:4px}
.pbody p{font-size:13px;color:var(--mut);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pmeta{display:flex;gap:14px;margin-top:12px;font-size:12px;color:var(--mut)}
.pmeta span{display:inline-flex;align-items:center;gap:5px}
.pmeta svg{width:14px;height:14px}
.pmeta .liked{color:#ff5f7a}
.addcard{border:1.5px dashed #333;border-radius:var(--r);min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mut);transition:border-color .2s,color .2s}
.addcard:hover{border-color:var(--edit);color:#fff}
.addcard svg{width:28px;height:28px}
.empty{color:var(--mut);text-align:center;padding:40px 0;grid-column:1/-1}

/* contact */
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:56px}
.ccard{padding:26px 22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.ccard .icirc{width:46px;height:46px}
.ccard .lbl{font-size:12px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.ccard .val{font-size:14px;font-weight:500;word-break:break-all}
.ccard .acts{display:flex;gap:8px;margin-top:auto}
.mini{font-size:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--line2);display:inline-flex;align-items:center;gap:6px;transition:border-color .2s}
.mini:hover{border-color:#555}
.mini svg{width:13px;height:13px}
footer{border-top:1px solid #151515;padding:34px 0;color:var(--mut2);font-size:13px;position:relative;z-index:1}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ===== ADMIN / EDIT ===== */
.sec-editing [data-edit]{outline:1px dashed rgba(255,255,255,.22);outline-offset:4px;border-radius:4px;cursor:text;transition:outline-color .15s}
.sec-editing [data-edit]:hover{outline-color:var(--edit)}
.sec-editing [data-edit]:focus{outline:2px solid var(--edit);background:rgba(77,163,255,.06)}
[data-edit]:empty::before{content:attr(data-ph);color:#555;font-style:italic}
[data-edit]:empty:not([contenteditable]){display:none}
.tools{display:none}
.sec-editing .tools{display:flex;position:absolute;top:10px;right:10px;gap:4px;z-index:5}
.tools button{width:28px;height:28px;border-radius:8px;background:#1f1f1f;border:1px solid #333;display:flex;align-items:center;justify-content:center;color:#ccc}
.tools button:hover{background:#2a2a2a;color:#fff}
.tools button.del:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.tools svg{width:14px;height:14px}
.addbtn{display:none}
.sec-editing .addbtn,body.admin .addbtn.always{display:inline-flex;align-items:center;gap:8px;margin-top:16px;padding:11px 18px;border:1.5px dashed #3a3a3a;border-radius:12px;color:#cfcfcf;font-size:13px;transition:border-color .2s}
.sec-editing .addbtn:hover,body.admin .addbtn.always:hover{border-color:var(--edit);color:#fff}
.addbtn svg{width:15px;height:15px}
.imgedit{display:none}
.sec-editing .imgedit{display:flex;position:absolute;inset:auto 12px 12px auto;gap:6px;z-index:6}
.imgedit button{font-size:12px;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);display:inline-flex;align-items:center;gap:6px}
.imgedit button:hover{background:var(--edit);border-color:var(--edit)}
.imgedit svg{width:14px;height:14px}
section.is-hidden>.wrap{opacity:.35}
.hidden-badge{display:none}
body.admin section.is-hidden .hidden-badge{display:block;position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:12px;background:#3a2a00;color:#ffcc66;padding:6px 14px;border-radius:999px;z-index:5}
.linkedit{display:none}
.sec-editing .linkedit{display:block;font-size:11px;color:var(--edit);margin-top:-6px}

.adminbar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:6px;background:rgba(18,18,18,.92);backdrop-filter:blur(14px);border:1px solid #2c2c2c;border-radius:999px;padding:6px;box-shadow:0 12px 40px rgba(0,0,0,.6);font-size:13px;max-width:calc(100vw - 24px);overflow-x:auto}
.adminbar .tag{padding:0 10px 0 12px;color:var(--mut);display:flex;align-items:center;gap:6px;white-space:nowrap}
.adminbar .tag i{width:8px;height:8px;border-radius:50%;background:#3ddc84;display:block}
.seg{display:flex;background:#0b0b0b;border-radius:999px;padding:3px;border:1px solid #242424}
.seg button{padding:8px 14px;border-radius:999px;color:#aaa;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:#fff;color:#000;font-weight:500}
.seg svg{width:14px;height:14px}
.abtn{padding:9px 14px;border-radius:999px;color:#ddd;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.abtn:hover{background:#222}
.abtn svg{width:15px;height:15px}
.abtn input[type=color]{width:20px;height:20px;border:0;padding:0;background:none;cursor:pointer;border-radius:50%}
.status{padding:0 12px;color:var(--mut2);font-size:12px;white-space:nowrap;min-width:92px}
.hint{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:79;background:#0f2a44;border:1px solid #1e4f80;color:#cfe6ff;padding:12px 16px 12px 18px;border-radius:14px;font-size:13px;display:flex;gap:14px;align-items:center;max-width:min(640px,calc(100vw - 24px));box-shadow:0 10px 30px rgba(0,0,0,.5)}
.hint b{color:#fff}
.hint button{flex:none;font-size:12px;padding:6px 10px;border-radius:8px;background:#1e4f80}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;animation:fade .2s}
.mbox{background:#0f0f0f;border:1px solid #262626;border-radius:22px;width:100%;max-width:760px;position:relative;overflow:hidden;animation:pop .25s}
.mbox.sm{max-width:440px}
.mclose{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.6);border:1px solid #333;display:flex;align-items:center;justify-content:center;z-index:3}
.mclose svg{width:16px;height:16px}
.mpad{padding:28px 32px 32px}
.dcover{aspect-ratio:16/8;position:relative;background:#111}
.dcover img,.dcover .ph{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.dmeta{font-size:12px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.dtitle{font-size:clamp(24px,3vw,34px);margin-top:8px}
.dbody{color:#c9c9c9;font-size:14.5px;margin-top:16px;white-space:pre-line}
.dacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;align-items:center}
.like{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;border:1px solid var(--line2);font-size:13px;transition:all .2s}
.like svg{width:16px;height:16px}
.like.on{background:#ff5f7a;border-color:#ff5f7a;color:#fff}
.like:hover{border-color:#ff5f7a}
.astats{margin-top:28px;border-top:1px solid #222;padding-top:22px}
.astats h4{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.astats h4 svg{width:14px;height:14px}
.plist{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.prow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#151515;font-size:13px}
.prow img{width:30px;height:30px;border-radius:50%}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .tm{color:var(--mut2);font-size:12px;white-space:nowrap}
.muted{color:var(--mut2);font-size:13px}
.form{display:grid;gap:16px}
.form label{display:grid;gap:6px;font-size:12px;color:var(--mut);letter-spacing:.04em}
.form input,.form textarea{background:#161616;border:1px solid #2a2a2a;border-radius:12px;padding:12px 14px;font-size:14px;outline:none;color:#fff;width:100%}
.form input:focus,.form textarea:focus{border-color:var(--edit)}
.form textarea{resize:vertical;min-height:90px}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fcover{aspect-ratio:16/8;border-radius:14px;overflow:hidden;position:relative;background:#161616;border:1px dashed #333}

function clone(o){return JSON.parse(JSON.stringify(o))}
function deepMerge(base, over){
  if(Array.isArray(base)) return Array.isArray(over)? clone(over) : base;
  if(base && typeof base==='object'){
    const out = {...base};
    if(over && typeof over==='object' && !Array.isArray(over)) for(const k of Object.keys(over)) out[k] = k in base ? deepMerge(base[k], over[k]) : (over[k]&&typeof over[k]==='object'? clone(over[k]) : over[k]);
    return out;
  }
  return over===undefined? base : over;
}

function h(tag, props, ...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(props||{})){
    if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;               // only for constant icons
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(k==='style') el.style.cssText=v;
    else el.setAttribute(k, v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){ if(c==null||c===false) continue; el.append(c instanceof Node?c:document.createTextNode(String(c))); }
  return el;
}
function put(el,...k){ el.replaceChildren(...k.flat(Infinity).filter(x=>x!=null&&x!==false&&x!==true)); }

function setupReadMore(){
  document.querySelectorAll('.descwrap').forEach(w=>{
    const p=w.firstChild, b=w.lastChild; if(p.classList.contains('open')) return;

function toggleMore(p,b){

  b.firstChild.textContent= open?'Tutup':'Baca selengkapnya';

const MONTHS={jan:0,january:0,januari:0,feb:1,february:1,februari:1,peb:1,mar:2,march:2,maret:2,apr:3,april:3,may:4,mei:4,jun:5,june:5,juni:5,jul:6,july:6,juli:6,aug:7,august:7,agu:7,agt:7,agustus:7,sep:8,sept:8,september:8,oct:9,october:9,okt:9,oktober:9,nov:10,november:10,nop:10,dec:11,december:11,des:11,desember:11};
function parseRange(str){
  const t=String(str||''); const parts=t.split(/\s*(?:–|—|-|\bs\/d\b|\bsd\b|\bto\b|\bsampai\b|\bhingga\b)\s*/i).filter(x=>x&&x.trim());
  const pt=(x,end)=>{ if(/present|sekarang|now|kini|saat ini|current/i.test(x)) return new Date(); const y=x.match(/(19|20)\d{2}/); if(!y) return null;
    const w=(x.toLowerCase().match(/[a-z]+/g)||[]).find(k=>MONTHS[k]!=null); return new Date(+y[0], w!=null? MONTHS[w] : (end?11:0), 1); };
  const a=parts[0]? pt(parts[0],false) : null; if(!a) return null;
  const b=parts[1]? (pt(parts[1],true)||a) : (/present|sekarang|now|kini/i.test(t)? new Date() : a);
  return b<a? [b,a] : [a,b];
}
function yearsOfExp(){
  const rs=(C.exp.items||[]).map(x=>parseRange(x.years)).filter(Boolean).map(([a,b])=>[a.getFullYear()*12+a.getMonth(), b.getFullYear()*12+b.getMonth()]).sort((x,y)=>x[0]-y[0]);
  let total=0, cur=null;
  for(const r of rs){ if(!cur){ cur=[...r]; continue; } if(r[0]<=cur[1]){ cur[1]=Math.max(cur[1],r[1]); } else { total+=cur[1]-cur[0]; cur=[...r]; } }
  if(cur) total+=cur[1]-cur[0];
  return Math.floor(total/12);
}

/* Simpan HANYA bagian yang diubah (bukan seluruh dokumen), supaya tidak menimpa isian lain */
let recentWrites=[];
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
/* bandingkan isi tanpa peduli urutan kolom (server menyimpan kolom dengan urutan abjad) */
function canon(v){ return Array.isArray(v)? '['+v.map(canon).join(',')+']' : (v&&typeof v==='object')? '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}' : JSON.stringify(v===undefined?null:v); }

function writePaths(paths, src){
  const body=bodyFor(paths,src), full=clone(src);
  const run=writeQ.then(async()=>{
    if(!db) throw {code:'offline'}; saving=true;
    const ref=db.doc('site/main');
    const attempt=async()=>{ try{ await ref.update(body); }
      catch(e){ if(e?.code==='invalid_argument'){ const s=await ref.get(); if(!s.exists){ await ref.set(full); return; } } throw e; } };
    try{
      try{ await attempt(); } catch(e){ if(e?.code==='unavailable'||e?.code==='resource_exhausted'){ await new Promise(r=>setTimeout(r,800+Math.random()*600)); await attempt(); } else throw e; }
      recentWrites.push({at:Date.now(), body});
      /* cek ulang ke server: pastikan isinya benar-benar masuk */
      let ok=false;
      for(let n=0;n<3 && !ok;n++){
        const chk=await ref.get(); ok=chk.exists && matchesBody(chk.data(), body);
        if(!ok){ console.warn('[pf] isi belum cocok, simpan ulang', paths); dlog('verify-mismatch',{paths, try:n+1}); await new Promise(r=>setTimeout(r,500)); await ref.update(body); }
      }
      if(!ok) throw {code:'verify_failed'};

    }
    finally{ saving=false; }
  });
  run.catch(e=>dlog('write-err',{paths, code:e?.code||null, msg:String(e?.message||e).slice(0,200)}));
  writeQ=run.catch(()=>{}); return run;
}

async function downscale(file){

const EASE=[.22,1,.36,1];
const RM=(()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch{ return false; } })();
const MO=()=> (!RM && window.Motion && typeof window.Motion.animate==='function') ? window.Motion : null;
let io=null;
function reveal(){
  const els=[...document.querySelectorAll('.rv:not(.in)')];
  if(adminView()){ els.forEach(e=>e.classList.add('in')); return; }
  const mo=MO();
  if(mo && typeof mo.inView==='function'){
    try{
      document.body.classList.add('m');
      els.forEach(el=>{ if(el._mv) return; el._mv=1;
        mo.inView(el,()=>{
          const sib=[...(el.parentElement?.children||[])].filter(x=>x.classList.contains('rv'));
          const d=(Math.max(0,sib.indexOf(el))%4)*.09;
          try{ const a=mo.animate(el,{opacity:[0,1],y:[34,0],filter:['blur(6px)','blur(0px)']},{duration:.85,delay:d,ease:EASE});
            Promise.resolve(a).then(()=>{ el.classList.add('in'); el.style.filter=''; }, ()=>el.classList.add('in')); }catch{ el.classList.add('in'); }
          setTimeout(()=>{ el.classList.add('in'); },2500);
        },{amount:.12});
      });
      return;
    }catch{ document.body.classList.remove('m'); }
  }
  if(!('IntersectionObserver' in window)){ document.querySelectorAll('.rv').forEach(e=>e.classList.add('in')); return; }
  io?.disconnect(); io=new IntersectionObserver(es=>es.forEach(x=>{ if(x.isIntersecting){ x.target.classList.add('in'); io.unobserve(x.target);} }),{threshold:.12});
  document.querySelectorAll('.rv:not(.in)').forEach(e=>io.observe(e));
}

    add(qa('.stat'),{opacity:[0,1],y:[18,0]},{duration:.55,delay:mo.stagger? mo.stagger(.08):0,at:'-0.7',ease:EASE});
    try{ mo.animate(seg); }catch{ return false; }
    // count-up angka statistik
    qa('.stat .n').forEach((el,i)=>{ if(!el.dataset.target) return; el._counting=true;
      const done=()=>{ el._counting=false; el.textContent=el.dataset.target+el.dataset.suf; };
      try{ mo.animate(0,1,{duration:1.6,delay:1+i*.12,ease:EASE,onUpdate:p=>{ el.textContent=Math.round(p*(+el.dataset.target||0))+el.dataset.suf; },onComplete:done}); }catch{ done(); }
      setTimeout(()=>{ if(el._counting) done(); },4500); });
    // jaring pengaman: jangan sampai ada yang tertinggal transparan
    setTimeout(()=>seg.forEach(([t])=>[].concat(t).forEach(el=>{ if(+getComputedStyle(el).opacity<.05){ el.style.opacity='1'; el.style.transform='none'; el.style.clipPath='none'; el.style.filter='none'; } })),4000);
    return true;

  if(!go()){ let n=0; const t=setInterval(()=>{ if(MO()){ clearInterval(t); if(scrollY<200) go(); } else if(++n>8) clearInterval(t); },80); }

  if(!db){ clearTimeout(giveUp); done(); return; }
  if(canEditCap){
    try{ const a=await db.doc('secure/auth').get(); authDoc=a.exists? clone(a.data()) : null; }catch{}
    let tok=null; try{ tok=sessionStorage.getItem('pf_auth'); }catch{}
    if(authDoc && tok && tok===authDoc.hash.slice(0,24)) authed=true;

function wireDb(giveUp){
  db.doc('site/main').onSnapshot(s=>{
    if(s.metadata.hasPendingWrites) return;
    /* data dari server terkunci (read-only): selalu salin dulu supaya bisa diubah */
    const next = s.exists ? deepMerge(clone(DEFAULT), clone(s.data())) : clone(DEFAULT);
    if(!s.metadata.fromCache) clearTimeout(giveUp);
    if(!booted){ C=next; done(); return; }
    if(saving) return;
    /* tolak data versi lama yang datang telat setelah kita menyimpan */
    recentWrites=recentWrites.filter(w=>Date.now()-w.at<15000);
    const raw=s.exists? s.data() : null;
    if(raw && recentWrites.some(w=>!matchesBody(raw,w.body))){ console.warn('[pf] abaikan data lama dari server'); dlog('stale-ignored',{}); return; }
    if(canEditCap && Date.now()-lastRemoteLog>5000){ lastRemoteLog=Date.now(); dlog('remote',{editing:editSec, cache:s.metadata.fromCache, changes:diffs(C,next).slice(0,5)}); }
    if(editSec || document.activeElement?.closest?.('[data-edit]')){ pendingRemote=next; return; }
    C=next; render();
  },()=>{ clearTimeout(giveUp); done(); });

  db.collection('projects').onSnapshot(s=>{
    projects=s.docs.map(d=>({id:d.id,...clone(d.data())})); if(booted){ fillProjects(); refreshStats(); }
    if(openPid && !projects.some(p=>p.id===openPid)) closeModal();
  },()=>{});
  db.collection('likes').onSnapshot(s=>{
    likesDocs={}; s.docs.forEach(d=>likesDocs[d.id]=clone(d.data()));
    if(meId && !myLikes) myLikes=clone(likesDocs[meId]||{items:{}});
    if(booted) fillProjects();
  },()=>{});
}

/* ---------- ADMIN VIA GITHUB (dipakai saat website berjalan di GitHub Pages) ----------
   Login memakai GitHub token milik pemilik repo. Token hanya disimpan di browser ini,
   tidak pernah ditulis ke repo. Setiap "Simpan" = 1 commit ke content.js. */
const GH={owner:'MasWisnu8', repo:'Portofolio-Upgrade', token:null, branch:null, sha:null, q:Promise.resolve()};
(function(){ const m=location.hostname.match(/^([^.]+)\.github\.io$/i); const seg=location.pathname.split('/').filter(Boolean)[0];
  if(m && seg && !/\.html?$/i.test(seg)){ GH.owner=m[1]; GH.repo=decodeURIComponent(seg); } })();
const LOCAL_URL={};
const STORE={docs:{}, subs:[]};
function ghSavedToken(){ try{ return sessionStorage.getItem('pf_gh')||localStorage.getItem('pf_gh'); }catch{ return null; } }
function ghForget(){ try{ sessionStorage.removeItem('pf_gh'); localStorage.removeItem('pf_gh'); }catch{} }
async function ghApi(path,opt={}){
  const r=await fetch('https://api.github.com/repos/'+GH.owner+'/'+GH.repo+path,{cache:'no-store',...opt,
    headers:{'Authorization':'Bearer '+GH.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});
  if(!r.ok){ const e=new Error('GitHub '+r.status); e.status=r.status;
    e.code= r.status===401?'bad_token' : r.status===403||r.status===404?'invalid_argument' : r.status===409||r.status===422?'conflict' : 'unavailable'; throw e; }
  return r.status===204? null : r.json();
}
function failWhy(err,base){
  if(err?.status===403||err?.status===404&&STATIC&&isAdmin){ if(STATIC&&!GH.readOnly){ GH.readOnly=true; renderAdmin(); } return 'Token GitHub belum punya izin menyimpan (Contents: Read and write)'; }
  if(err?.status===401) return 'Token GitHub kedaluwarsa — login ulang';
  if(err?.status===409||err?.status===422) return base+' — ada perubahan bersamaan, coba lagi';
  if(err?.status) return base+' (kode '+err.status+')';
  if(err instanceof TypeError) return base+' — periksa koneksi internet';
  return base+' — coba lagi';
}
let noWriteShown=0;
function ghNoWrite(){ if(Date.now()-noWriteShown<8000) return; noWriteShown=Date.now(); ghAccountForm(true,true); }
const ghQueue=fn=>{ const run=GH.q.then(fn); GH.q=run.catch(()=>{}); return run; };
const u8b64=u8=>{ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); };
const txtB64=t=>u8b64(new TextEncoder().encode(t));
const b64Txt=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const blobB64=b=>new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.onerror=rej; fr.readAsDataURL(b); });
function readContentJs(text){ const w={}; new Function('window',text)(w); return w; }
function contentJsText(){
  const site=STORE.docs['site/main']||{};
  const projs=Object.keys(STORE.docs).filter(k=>/^projects\/[^/]+$/.test(k)).map(k=>({...STORE.docs[k], id:k.split('/')[1]}));
  const priv=STORE.docs['private/files']||{};
  return '/* Isi website. Diperbarui otomatis dari halaman admin (#admin). */\n'
    +'window.SITE_CONTENT = '+JSON.stringify({site, projects:projs, private:priv},null,2)+';\n'
    +'window.SITE_ASSETS = '+JSON.stringify(window.SITE_ASSETS||{},null,2)+';\n';
}
async function ghLoadContent(){
  const f=await ghApi('/contents/content.js?ref='+encodeURIComponent(GH.branch));
  GH.sha=f.sha; const w=readContentJs(b64Txt(f.content));
  const S=w.SITE_CONTENT||{}; window.SITE_ASSETS={...(window.SITE_ASSETS||{}),...(w.SITE_ASSETS||{})};
  STORE.docs={'site/main':clone(S.site||{})};
  (S.projects||[]).forEach(p=>{ const {id,...rest}=p; if(id) STORE.docs['projects/'+id]=clone(rest); });
  if(S.private) STORE.docs['private/files']=clone(S.private);
}
function ghCommitContent(msg){
  return ghQueue(async()=>{
    const put=()=>ghApi('/contents/content.js',{method:'PUT',body:JSON.stringify({message:msg||'Perbarui isi website dari admin',content:txtB64(contentJsText()),sha:GH.sha,branch:GH.branch})});
    let r; try{ r=await put(); }
    catch(e){ if(e.code!=='conflict') throw e; const f=await ghApi('/contents/content.js?ref='+encodeURIComponent(GH.branch)); GH.sha=f.sha; r=await put(); }
    GH.sha=r.content.sha;
  });
}
const deepPatch=(base,patch)=>{ const out=(base&&typeof base==='object'&&!Array.isArray(base))? {...base} : {};
  for(const [k,v] of Object.entries(patch||{})) out[k]= (v&&typeof v==='object'&&!Array.isArray(v))? deepPatch(out[k],v) : clone(v); return out; };
const PERSIST=/^(site\/main|projects\/[^/]+|private\/files)$/;
function snapOf(path){ const d=STORE.docs[path]; return {exists:d!==undefined, id:path.split('/').pop(), data:()=>clone(d), metadata:{hasPendingWrites:false, fromCache:false}}; }
function ghNotify(){ STORE.subs.slice().forEach(f=>{ try{ f(); }catch(e){ console.warn(e); } }); }
async function ghWrite(path, fn, msg){
  const before=STORE.docs[path]; fn();
  if(!PERSIST.test(path)) return;
  try{ await ghCommitContent(msg); }
  catch(e){ if(before===undefined) delete STORE.docs[path]; else STORE.docs[path]=before; throw e; }
  ghNotify();
}
const ghDb={
  doc(path){ return {
    get:async()=>snapOf(path),
    set:v=>ghWrite(path,()=>{ STORE.docs[path]=clone(v); }, path.startsWith('projects/')? 'Simpan project: '+(v?.title||path) : null),
    update:v=>{ if(STORE.docs[path]===undefined) return Promise.reject({code:'invalid_argument'}); return ghWrite(path,()=>{ STORE.docs[path]=deepPatch(STORE.docs[path],v); }); },
    delete:()=>ghWrite(path,()=>{ delete STORE.docs[path]; }, 'Hapus '+path),
    onSnapshot(cb){ const f=()=>cb(snapOf(path)); STORE.subs.push(f); f(); return ()=>{}; }
  }; },
  collection(name){ return { onSnapshot(cb){
    const f=()=>cb({docs:Object.keys(STORE.docs).filter(k=>k.startsWith(name+'/')&&k.split('/').length===2).map(k=>({id:k.split('/')[1], data:()=>clone(STORE.docs[k])}))});
    STORE.subs.push(f); f(); return ()=>{}; } }; }
};
const EXT={'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif','application/pdf':'pdf'};
const ghAssets={
  async upload(blob,{type}={}){
    type=type||blob.type||'application/octet-stream';
    const id=[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
    const path='assets/'+(type==='application/pdf'?'docs':'img')+'/'+id+'.'+(EXT[type]||'bin');
    const content=await blobB64(blob);
    await ghQueue(()=>ghApi('/contents/'+path,{method:'PUT',body:JSON.stringify({message:'Upload '+path,content,branch:GH.branch})}));
    window.SITE_ASSETS[id]=path; LOCAL_URL[id]=URL.createObjectURL(blob);
    return {id, sizeBytes:blob.size};
  },
  async delete(id){
    const path=(window.SITE_ASSETS||{})[id]; if(!path) return;
    await ghQueue(async()=>{ const f=await ghApi('/contents/'+path+'?ref='+encodeURIComponent(GH.branch));
      await ghApi('/contents/'+path,{method:'DELETE',body:JSON.stringify({message:'Hapus '+path,sha:f.sha,branch:GH.branch})}); });
    delete window.SITE_ASSETS[id];
  }
};
async function ghLogin(token,{silent=false,remember=false,setup=false}={}){
  GH.token=token.trim();
  try{
    const r=await ghApi('');
    if(!r.permissions?.push){ const e=new Error('no push'); e.code='invalid_argument'; throw e; }
    GH.branch=r.default_branch;
    GH.readOnly=false;
    try{ await ghApi('/git/blobs',{method:'POST',body:JSON.stringify({content:'cek-izin',encoding:'utf-8'})}); }catch(e){ if(e.status===403||e.status===404) GH.readOnly=true; }
    await ghLoadContent();
  }catch(e){ GH.token=null; if(silent){ ghForget(); return false; } throw e; }
  ghForget(); try{ (remember? localStorage : sessionStorage).setItem('pf_gh',GH.token); }catch{}
  db=ghDb; assets=ghAssets; canEditCap=true; authed=true;
  updateRole();
  if(!GH.wired){ GH.wired=true; wireDb(null); }
  ghNotify(); render();
  if(GH.readOnly){ if(setup){ const e=new Error('read only'); e.status=403; throw e; } setTimeout(ghNoWrite,500); }
  else if(!setup){ if(!ghAuthLoaded) await ghLoadAuth(); if(!ghAuth) setTimeout(()=>ghAccountForm(true),500); }
  return true;
}

/* ---------- LOGIN ADMIN: USERNAME + PASSWORD ----------
   GitHub token disimpan TERENKRIPSI di admin-auth.json (AES-GCM, kunci dari PBKDF2 600.000 putaran
   atas username+password). Tanpa password yang benar, isi file itu tidak bisa dipakai. */
const AUTH_FILE='admin-auth.json', AUTH_ITER=600000;
let ghAuth=null, ghAuthLoaded=false;
async function ghLoadAuth(){
  const urls=[AUTH_FILE+'?t='+Date.now(), 'https://raw.githubusercontent.com/'+GH.owner+'/'+GH.repo+'/HEAD/'+AUTH_FILE+'?t='+Date.now()];
  ghAuth=null;
  for(const u of urls){ try{ const r=await fetch(u,{cache:'no-store'}); if(r.ok){ const j=await r.json(); if(j&&j.ct){ ghAuth=j; break; } } }catch{} }
  if(!(ghAuth && ghAuth.ct && ghAuth.salt && ghAuth.iv)) ghAuth=null; ghAuthLoaded=true; return ghAuth;
}
const b64u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function authKey(user,pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(user.trim().toLowerCase()+'\n'+pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function sealToken(user,pw,token){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await authKey(user,pw,salt,AUTH_ITER);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(token)));
  return {v:1, kdf:'PBKDF2-SHA256', iter:AUTH_ITER, salt:u8b64(salt), iv:u8b64(iv), ct:u8b64(ct), updatedAt:new Date().toISOString()};
}
async function openToken(user,pw,a){
  const key=await authKey(user,pw,b64u8(a.salt),a.iter||AUTH_ITER);
  try{ return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(a.iv)},key,b64u8(a.ct))); }catch{ return null; }
}
async function ghSaveAuth(user,pw){
  const blob=await sealToken(user,pw,GH.token);
  await ghQueue(async()=>{ let sha; try{ sha=(await ghApi('/contents/'+AUTH_FILE+'?ref='+encodeURIComponent(GH.branch))).sha; }catch{}
    await ghApi('/contents/'+AUTH_FILE,{method:'PUT',body:JSON.stringify({message:'Perbarui login admin',content:txtB64(JSON.stringify(blob,null,2)+'\n'),sha,branch:GH.branch})}); });
  ghAuth=blob; ghAuthLoaded=true;
  const chk=await ghApi('/contents/'+AUTH_FILE+'?ref='+encodeURIComponent(GH.branch));
  if(!chk?.sha) throw new Error('verify');
}

      if(n1.value!==n2.value) return msg.textContent='Password baru dan ulangannya tidak sama.';
      btn.disabled=true; btn.textContent='Menyimpan…';
      try{ if(ntok.value.trim()) await ghLogin(ntok.value,{setup:true}); else if(GH.readOnly){ const e=new Error('ro'); e.status=403; throw e; } await ghSaveAuth(user.value,n1.value); closeModal(); renderAdmin(); toast('Login admin tersimpan ✓'); }
      catch(e){ btn.disabled=false; btn.textContent='Simpan'; msg.textContent= e?.status===403 ? 'Token GitHub ini hanya bisa membaca, belum bisa menyimpan. Buat token baru dengan izin Contents: Read and write untuk repo Portofolio-Upgrade, lalu tempel di kolom token.' : e?.code==='bad_token' ? 'Token GitHub tidak valid atau sudah kedaluwarsa.' : 'Gagal menyimpan ke GitHub'+(e?.status?' (kode '+e.status+')':'')+'. Coba lagi.'; ntok.focus(); }
    }},
    h('h3',{class:'h',style:'font-size:22px'}, noWrite?'Perbarui Token GitHub':first?'Simpan Login Admin':'Akun Admin'),
    h('p',{class:'muted'}, noWrite? 'Token GitHub yang sedang dipakai hanya bisa MEMBACA, jadi foto & project tidak bisa disimpan. Buat token baru dengan izin Contents: Read and write, lalu tempel di kolom token di bawah bersama username & password.' : first? 'Login username & password belum tersimpan di GitHub. Buat sekarang supaya di perangkat atau browser mana pun kamu cukup login dengan username & password, tanpa token lagi.' : 'Ganti username dan password login admin. Login lama langsung tidak berlaku.'),
    h('label',{},'Username baru',user), h('label',{},'Password baru',n1w), h('p',{class:'muted',style:'font-size:12px;margin-top:-8px'},PW_RULE), h('label',{},'Ulangi password baru',n2w),
    h('label',{},'GitHub token baru (opsional)',ntok), h('p',{class:'muted',style:'font-size:12px;margin-top:-8px'},'Isi hanya jika muncul pesan izin/kode 403. Token harus punya izin Contents: Read and write.'), msg,
    h('div',{class:'fact'}, h('button',{class:'fbtn',type:'button',onclick:closeModal},'Batal'), btn))),'sm');
}

/* ---------- ROLE / AUTH ---------- */
function subPriv(){
  if(privSub||!db) return; privSub=true;
  db.doc('private/files').onSnapshot(s=>{ const nx= s.exists? clone(s.data().files||{}) : {}; if(canon(nx)!==canon(privFiles)){ privFiles=nx; if(booted) render(); } },()=>{ privSub=false; });
}
function updateRole(){
  const was=isAdmin;
  isAdmin = route()==='admin' && authed && canEditCap;
  if(!isAdmin){ if(backup) C=backup; editSec=null; backup=null; dirty=false; preview=false; }
  if(isAdmin) subPriv();
  if(isAdmin && db && !viewsSub){ viewsSub=true;
    db.collection('views').onSnapshot(s=>{ viewsDocs={}; s.docs.forEach(d=>viewsDocs[d.id]=clone(d.data())); if(booted) fillProjects(); },()=>{ viewsSub=false; });
  }
}
window.addEventListener('hashchange',()=>{ closeModal(); updateRole(); if(booted){ render(); window.scrollTo(0,0); } });
const b64=u8=>btoa(String.fromCharCode(...u8));
async function hashPw(pw, saltB64, iter){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const salt=Uint8Array.from(atob(saltB64),c=>c.charCodeAt(0));
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},key,256);
  return b64(new Uint8Array(bits));
}
async function makeAuth(username,pw){
  const salt=b64(crypto.getRandomValues(new Uint8Array(16))); const iter=150000;
  return {username:username.trim(), salt, iter, hash:await hashPw(pw,salt,iter), updatedAt:Date.now()};
}
async function checkPw(username,pw){
  if(!authDoc) return false;
  if(username.trim().toLowerCase()!==String(authDoc.username||'').toLowerCase()) { await hashPw(pw,authDoc.salt,authDoc.iter); return false; }
  return (await hashPw(pw,authDoc.salt,authDoc.iter))===authDoc.hash;
}
function rememberLogin(){ try{ sessionStorage.setItem('pf_auth',authDoc.hash.slice(0,24)); }catch{} }
function enterAdmin(){ dlog('login',{}); authed=true; rememberLogin(); updateRole(); render(); window.scrollTo(0,0); }
function logout(){ authed=false; try{ sessionStorage.removeItem('pf_auth'); }catch{} if(STATIC){ ghForget(); GH.token=null; canEditCap=false; } closeModal(); updateRole(); render(); toast('Kamu sudah keluar dari admin'); }

function pwField(ph, ac){
  const inp=h('input',{type:'password',placeholder:ph,autocomplete:ac,required:true});
  const t=h('button',{type:'button',class:'eyebtn',html:IC.eye,'aria-label':'Tampilkan password',onclick:()=>{ inp.type=inp.type==='password'?'text':'password'; }});
  return [h('div',{class:'pw'},inp,t), inp];
}
function renderGate(){
  const root=document.getElementById('adminroot');
  const msg=h('p',{class:'gmsg'});
  const guestLink=h('a',{href:'#',class:'glink',onclick:e=>{ e.preventDefault(); history.replaceState(null,'',location.pathname+location.search); window.dispatchEvent(new HashChangeEvent('hashchange')); }},'← Kembali ke tampilan tamu');
  const head=(t,sub)=>[h('div',{class:'glogo',html:IC.user}), h('h1',{class:'h gtitle'},t), h('p',{class:'gsub'},sub)];
  let body;
  if(STATIC){
    body=ghGateBody(head,msg,guestLink);
  } else if(!db){
    body=[...head('Halaman Admin','Masuk ke akun Claude kamu terlebih dahulu, lalu buka link admin ini lagi.'), guestLink];
  } else if(!window.crypto?.subtle){
    body=[...head('Halaman Admin','Browser ini tidak mendukung login aman. Coba buka di browser lain.'), guestLink];
  } else if(canEditCap && !authDoc){
    const user=h('input',{type:'text',placeholder:'Buat username',autocomplete:'username',required:true,minlength:3});
    const [pw1w,pw1]=pwField('Buat password (min. 6 karakter)','new-password');
    const [pw2w,pw2]=pwField('Ulangi password','new-password');
    const btn=h('button',{class:'fbtn pri gbtn',type:'submit'},'Simpan & Masuk');
    body=[...head('Buat Akun Admin','Pertama kali di sini. Buat username dan password — nanti setiap masuk ke halaman admin wajib login dengan ini.'),
      h('form',{class:'form',onsubmit:async e=>{ e.preventDefault(); msg.textContent='';
        if(user.value.trim().length<3) return msg.textContent='Username minimal 3 karakter.';
        if(pw1.value.length<6) return msg.textContent='Password minimal 6 karakter.';
        if(pw1.value!==pw2.value) return msg.textContent='Password dan ulangannya tidak sama.';
        btn.disabled=true; btn.textContent='Menyimpan…';
        try{ const a=await makeAuth(user.value,pw1.value); await db.doc('secure/auth').set(a); authDoc=a; enterAdmin(); toast('Akun admin dibuat ✓'); }
        catch{ btn.disabled=false; btn.textContent='Simpan & Masuk'; msg.textContent='Gagal menyimpan. Coba lagi.'; }
      }}, h('label',{},'Username',user), h('label',{},'Password',pw1w), h('label',{},'Ulangi password',pw2w), msg, btn), guestLink];
  } else {
    const user=h('input',{type:'text',placeholder:'Username',autocomplete:'username',required:true});
    const [pww,pw]=pwField('Password','current-password');
    const btn=h('button',{class:'fbtn pri gbtn',type:'submit'},'Login');
    body=[...head('Login Admin','Masukkan username dan password untuk mengelola portofolio.'),
      h('form',{class:'form',onsubmit:async e=>{ e.preventDefault(); msg.textContent='';
        if(Date.now()<lockUntil){ msg.textContent='Terlalu banyak percobaan. Tunggu '+Math.ceil((lockUntil-Date.now())/1000)+' detik.'; return; }
        btn.disabled=true; btn.textContent='Memeriksa…';
        let ok=false; try{ ok = canEditCap && await checkPw(user.value,pw.value); }catch{}
        btn.disabled=false; btn.textContent='Login';
        if(ok){ failCount=0; enterAdmin(); toast('Berhasil masuk ✓'); return; }
        if(!canEditCap){ msg.textContent='Akun Claude ini tidak punya akses admin ke portofolio ini.'; return; }
        failCount++; if(failCount>=5){ failCount=0; lockUntil=Date.now()+30000; }
        msg.textContent='Username atau password salah.'; pw.value=''; pw.focus();
      }}, h('label',{},'Username',user), h('label',{},'Password',pww), msg, btn), guestLink];
  }
  put(root, h('div',{class:'gate'}, h('div',{class:'gcard'}, body)));
  root.querySelector('input')?.focus();
}
function accountForm(){
  const user=h('input',{type:'text',value:authDoc?.username||'',autocomplete:'username',required:true});
  const [oldw,old]=pwField('Password saat ini','current-password');
  const [n1w,n1]=pwField('Password baru (min. 6 karakter)','new-password');
  const [n2w,n2]=pwField('Ulangi password baru','new-password');
  const msg=h('p',{class:'gmsg'}); const btn=h('button',{class:'fbtn pri',type:'submit'},'Simpan');
  openModal(h('div',{class:'mpad'}, h('form',{class:'form',onsubmit:async e=>{ e.preventDefault(); msg.textContent='';
      if(user.value.trim().length<3) return msg.textContent='Username minimal 3 karakter.';
      if(n1.value.length<6) return msg.textContent='Password baru minimal 6 karakter.';
      if(n1.value!==n2.value) return msg.textContent='Password baru dan ulangannya tidak sama.';
      btn.disabled=true;
      const ok = authDoc && (await hashPw(old.value,authDoc.salt,authDoc.iter))===authDoc.hash;
      if(!ok){ btn.disabled=false; return msg.textContent='Password saat ini salah.'; }
      try{ const a=await makeAuth(user.value,n1.value); await db.doc('secure/auth').set(a); authDoc=a; rememberLogin(); closeModal(); toast('Username & password diperbarui ✓'); }
      catch{ btn.disabled=false; msg.textContent='Gagal menyimpan. Coba lagi.'; }
    }},
    h('h3',{class:'h',style:'font-size:22px'},'Akun Admin'),
    h('p',{class:'muted'},'Ganti username dan/atau password login admin.'),
    h('label',{},'Username',user), h('label',{},'Password saat ini',oldw), h('label',{},'Password baru',n1w), h('label',{},'Ulangi password baru',n2w), msg,
    h('div',{class:'fact'}, h('button',{class:'fbtn',type:'button',onclick:closeModal},'Batal'), btn))),'sm');
}
init();
